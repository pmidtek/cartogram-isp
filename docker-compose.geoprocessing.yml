version: "3"
services:
  geoprocessing:
    build:
      context: manager/python
      dockerfile: Dockerfile.manual
    environment:
      - TZ=Asia/Jakarta
      - DB_CONNECTION_STRING
      - STORAGE_S3_KEY
      - STORAGE_S3_SECRET
      - STORAGE_S3_ENDPOINT
      - STORAGE_S3_BUCKET
      - STORAGE_S3_REGION
      - STORAGE_S3_ROOT
      - ADMIN_TOKEN
      - DIRECTUS_PUBLIC_URL
      - ORS_KEY
      - HERE_KEY
      - ROAD_API_URL
      - ROAD_API_KEY
    volumes:
      - "./data:/data"
    restart: no