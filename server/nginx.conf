user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;
# pid /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    access_log    /var/log/nginx/access.log;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    send_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # include /etc/nginx/conf.d/*.conf;

    map $http_upgrade $connection_upgrade {
        default	    "upgrade";
    }

    upstream directus_upstream {
        least_conn;
        server directus:8055;
    }

    
    # upstream fastapi_upstream {
    #     least_conn;
    #     server fastapi:8000;
    # }

    server {
        listen 80 default_server;
        gzip on;
        gzip_comp_level 4;
        gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/x-protobuf;

        location /panel/analysis {
            # proxy_connect_timeout  30s;
            # proxy_send_timeout     1m;
            proxy_read_timeout     10m;
            # send_timeout           1m;
            # client_body_timeout    1m;

            proxy_pass              http://directus_upstream/analysis;
            proxy_http_version      1.1;

            proxy_set_header    Connection              $connection_upgrade;
            proxy_set_header    Upgrade                 $http_upgrade;
            proxy_set_header    Host                    $host;
            proxy_set_header    X-Real-IP               $remote_addr;
            proxy_set_header    X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto       $scheme;
        }


        location /panel/ {
            client_max_body_size 500m;

            proxy_pass              http://directus_upstream/;
            proxy_http_version      1.1;

            proxy_set_header    Connection              $connection_upgrade;
            proxy_set_header    Upgrade                 $http_upgrade;
            proxy_set_header    Host                    $host;
            proxy_set_header    X-Real-IP               $remote_addr;
            proxy_set_header    X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto       $scheme;
        }

        location = /panel/files {
            client_max_body_size 500m;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            send_timeout 1h;

            proxy_pass              http://directus_upstream/files;
            proxy_http_version      1.1;

            proxy_set_header    Connection              $connection_upgrade;
            proxy_set_header    Upgrade                 $http_upgrade;
            proxy_set_header    Host                    $host;
            proxy_set_header    X-Real-IP               $remote_addr;
            proxy_set_header    X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto       $scheme;
        }

        location = /health {
            access_log off;
            add_header "Content-Type" "text/plain";
            return 200 "OK";
        }

        #            # ensure /api (no slash) redirects to /api/
        # location = /api {
        #     return 301 /api/;
        # }

        # # proxy /api/* to fastapi but strip the /api prefix
        # location /api/ {
        #     proxy_http_version 1.1;

        #     # Strip the /api/ prefix by using a proxy_pass with trailing slash
        #     proxy_pass http://fastapi_upstream/;

        #     # headers
        #     proxy_set_header Connection $connection_upgrade;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;

        #     # optional: tell backend what prefix was used
        #     proxy_set_header X-Forwarded-Prefix /api;

        #     proxy_redirect off;
        # }


        location / {
            proxy_pass              http://web:3000/;
            proxy_http_version      1.1;

            proxy_set_header    Connection              $connection_upgrade;
            proxy_set_header    Upgrade                 $http_upgrade;
            proxy_set_header    Host                    $host;
            proxy_set_header    X-Real-IP               $remote_addr;
            proxy_set_header    X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto       $scheme;
        }
    }
}
